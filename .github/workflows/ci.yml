# A push to main is a release (downstream projects install from main), so
# every push and pull request runs the whole gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e ".[all,dev]" "mypy==2.4.0"
      - run: ruff check .
      # mypy is advisory (metaclass-heavy internals), but its findings may
      # only go down: lower .mypy-baseline when you fix some.
      - name: mypy findings do not grow
        run: |
          found=$(mypy zeeb_orm zeeb_api zeeb_agents | tail -1 | grep -oE '^Found [0-9]+' | grep -oE '[0-9]+' || echo 0)
          baseline=$(cat .mypy-baseline)
          echo "mypy: $found findings (baseline $baseline)"
          test "$found" -le "$baseline"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all,dev]"
      - run: pytest -n auto

  # The rest of the suite runs on SQLite; this runs the dialect conformance
  # tests on the databases whose code paths SQLite never executes.
  dialects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            url: postgresql+asyncpg://postgres:zeeb@127.0.0.1:5432/zeeb
          - database: mysql
            url: mysql+aiomysql://root:zeeb@127.0.0.1:3306/zeeb
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: zeeb
          POSTGRES_DB: zeeb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zeeb
          MYSQL_DATABASE: zeeb
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pzeeb" --health-interval 5s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all,dev]"
      - run: pytest tests/test_dialect_conformance.py -v
        env:
          ZEEB_TEST_DATABASE_URL: ${{ matrix.url }}
