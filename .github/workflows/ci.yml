# A push to main is a release (downstream projects install from main), so
# every push and pull request runs the whole gate.
#
# Every job installs against requirements-ci.txt, the pinned set that
# Dependabot bumps (see .github/CI.md), so a run is reproducible and a new
# upstream release only reaches CI as a reviewable pull request. The
# scheduled dependencies.yml workflow is what tests the unpinned world.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight; pushes to main
# never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -e ".[all,dev]" -c requirements-ci.txt
      - run: ruff check .
      # mypy is advisory (metaclass-heavy internals), but its findings may
      # only go down: lower .mypy-baseline when you fix some.
      - name: mypy findings do not grow
        run: |
          found=$(mypy zeeb_orm zeeb_api zeeb_agents | tail -1 | grep -oE '^Found [0-9]+' | grep -oE '[0-9]+' || echo 0)
          baseline=$(cat .mypy-baseline)
          echo "mypy: $found findings (baseline $baseline)"
          test "$found" -le "$baseline"

  # requirements-ci.txt is generated from pyproject.toml; a change to the
  # project's dependencies has to come with the regenerated pins.
  constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install uv -c requirements-ci.txt
      - name: requirements-ci.txt matches pyproject.toml
        run: |
          # uv keeps the pins already in the output file; this checks that they
          # still satisfy pyproject.toml, not that they are the newest.
          uv pip compile pyproject.toml --all-extras --universal --python-version 3.10 \
            -o requirements-ci.txt
          git diff --exit-code -- requirements-ci.txt || {
            echo "::error file=requirements-ci.txt::out of date — run: uv pip compile pyproject.toml --all-extras --universal --python-version 3.10 -o requirements-ci.txt"
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -e ".[all,dev]" -c requirements-ci.txt
      - run: pytest -n auto

  # The rest of the suite runs on SQLite; this runs the dialect conformance
  # tests on the databases whose code paths SQLite never executes.
  dialects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            url: postgresql+asyncpg://postgres:zeeb@127.0.0.1:5432/zeeb
          - database: mysql
            url: mysql+aiomysql://root:zeeb@127.0.0.1:3306/zeeb
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: zeeb
          POSTGRES_DB: zeeb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zeeb
          MYSQL_DATABASE: zeeb
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pzeeb" --health-interval 5s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -e ".[all,dev]" -c requirements-ci.txt
      - run: pytest tests/test_dialect_conformance.py -v
        env:
          ZEEB_TEST_DATABASE_URL: ${{ matrix.url }}
