[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zeeb-orm"
version = "0.1.0"
description = "A Django-like ORM wrapper built on SQLAlchemy and Alembic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Zeeb Cloud" }
]
keywords = ["orm", "sqlalchemy", "alembic", "django", "async", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Database",
]
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "greenlet>=3.0.0",
    "fastapi>=0.100.0",
    "pydantic[email]>=2.0.0",
    "uvicorn[standard]>=0.23.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
postgresql = ["asyncpg>=0.29.0", "psycopg2-binary>=2.9.0"]
mysql = ["aiomysql>=0.2.0", "pymysql>=1.1.0"]
sqlite = ["aiosqlite>=0.19.0"]
mcp = ["mcp>=1.0.0"]
all = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "aiosqlite>=0.19.0",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "mcp>=1.0.0",
]

[project.scripts]
zeeb = "zeeb_orm.cli.main:main"
zeeb-manage = "zeeb_orm.cli.main:main"
zeeb-mcp = "zeeb_orm.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["zeeb_orm", "zeeb_api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
